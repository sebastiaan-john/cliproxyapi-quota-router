# Merge this into your CLIProxyAPI config.yaml.
# The key under plugins.configs must match the plugin ID, which the host takes
# from the library file name (cliproxyapi-quota-router.so/.dylib/.dll).
plugins:
  enabled: true
  dir: "plugins"
  configs:
    cliproxyapi-quota-router:
      enabled: true
      priority: 10

      # smart | headroom. expiring-first is another name for smart.
      mode: smart
      # New sessions skip a credential while any window has less than 2% left.
      # A window at 0% is skipped even when this is 0.
      minimum_headroom: 0.02
      # A session already bound to a credential keeps using it down to this
      # headroom, so the prompt cache built there is not discarded early. Must be
      # at most minimum_headroom. 0 means: until the quota is actually gone.
      session_minimum_headroom: 0
      # Credentials that bill per request (API keys on Claude/Codex, Anthropic
      # extra usage on an exhausted account) are never chosen unless this is
      # true, and then only when no subscription quota is usable.
      paid_fallback: false
      # Used when quota data cannot rank the candidates: round-robin | fill-first | none.
      # none leaves the pick to the host only while no candidate is skipped.
      fallback: round-robin

      # How often to re-read host auth state (disabled flags, retry times).
      refresh_interval: 5m
      # A credential with any quota window older than this is refreshed by routing
      # one request to it.
      stale_after: 30m
      # Minimum gap between two probe picks of the same credential.
      probe_interval: 1m
      # Resets closer than this are scored as if they were this far away.
      min_reset_horizon: 1h

      # Stay on the current credential unless another scores 15% higher.
      switch_margin: 0.15
      # Scores within 5% of the best count as a tie.
      tie_tolerance: 0.05

      session_affinity: true
      # Inactivity TTL: every request on a session renews it.
      session_affinity_ttl: 1h
      # Absolute path of a private (0600) file holding session bindings across
      # proxy restarts. Stores only session hashes, SHA-256 auth digests and
      # expiries. Flushed every refresh_interval and on shutdown; a crash loses
      # bindings made since the last flush. Empty (the default) disables it.
      # state_file: /var/lib/cliproxyapi/quota-router-state.json

      # true: rank candidates from every priority tier, not only the highest.
      across_priorities: false

      log_decisions: false
      # Auth IDs are often file names containing e-mail addresses. Diagnostics
      # show a hash unless this is enabled.
      reveal_auth_ids: false
